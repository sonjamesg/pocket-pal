<script>
function readyArt(){if(String(window.__SHOT).startsWith('title'))return !!(typeof LOGO!=='undefined'&&(LOGO.ok||LOGO.err));return !!(ART_REV && IMG.b_farmhouse && IMG.b_farmhouse.complete && IMG.b_farmhouse.naturalWidth && (!window.__SHOT.includes('farmer') || (IMG.phattie && IMG.phattie.naturalWidth)))}
function upload(name){return new Promise((res,rej)=>{cv.toBlob(async blob=>{try{const r=await fetch('/__shot/'+name,{method:'POST',body:blob});res(await r.text())}catch(e){rej(e)}},'image/png')})}
function setup(){
  ACC.token='shot-token';ACC.name='SHOT';
  DB.avatar='cowboy';DB.playerName='SHOT';DB.introDone=1;DB.wallet=2618;saveDB();
  ui.gate=0;ui.modal=null;ui.msgT=0;
  try{const ov=document.getElementById('acctov'); if(ov)ov.hidden=true}catch(e){}
  const shot=window.__SHOT;
  if(!(String(shot).startsWith('title'))) openMap();
  if(shot==='house-day'||shot==='house-night'){
    intEnter('house',HOME[0]+1,HOME[1]+2);
    Object.assign(ui.ow,{x:6,y:5,px:6*TS,py:5*TS,dir:'up',mv:null});
  } else if(shot==='exterior'){
    Object.assign(ui.ow,{x:HOME[0]+1,y:HOME[1]+3,px:(HOME[0]+1)*TS,py:(HOME[1]+3)*TS,dir:'up',mv:null});
  } else if(shot==='farmer-talk'){
    try{intEnter('chickfarm',2,8)}catch(e){}
    Object.assign(ui.ow,{x:5,y:5,px:5*TS,py:5*TS,dir:'up',mv:null});
    say('Farmer HATTIE: "CLUCKY HOLLOW opens after 10 WOOL CYCLES — you have 4. Shear sheep (1 cycle = 6h fleece regrow) and check the 🏆 board!"',9999);
    ui.msgC=9999;
  } else if(shot==='barn-sheep'){
    Object.assign(ui.ow,{x:52,y:45,px:52*TS,py:45*TS,dir:'up',mv:null});
  } else if(shot==='title-gate'||shot==='title-gate-phone'){
    S={scene:'title'}; ui.gate=true; ui.modal=null; ui.msgT=0;
    // Hold pulse at peak scale (sin≈1) every frame so M-corner miters would show if present
    if(!window.__titlePulseFix){window.__titlePulseFix=1;const _f=frame;frame=function(){ui.anim=21;return _f.apply(this,arguments)}}
  }
  note('setup ok shot='+shot+' scene='+S.scene+' CUR='+CUR+' gate='+!!ui.gate+' night='+(typeof nightNow==='function'?nightNow():'?')+' who='+(ui.msgWho&&ui.msgWho.n));
}
async function run(){
  let tries=0;
  while(!readyArt() && tries++<80){note('wait art '+Object.keys(IMG).length+' rev='+ART_REV+' tries='+tries); await new Promise(r=>setTimeout(r,200))}
  if(!readyArt()){note('FAIL art never ready'); document.title='SHOT_FAIL_ART'; return}
  try{setup()}catch(e){note('FAIL setup '+e); document.title='SHOT_FAIL_SETUP'; console.error(e); return}
  // allow intEnter auto-say (50ms) + art settle
  await new Promise(r=>setTimeout(r,250));
  for(let i=0;i<90;i++) await new Promise(r=>requestAnimationFrame(r));
  try{if(ui.msg){ui.msgC=9999;ui.msgShown=ui.msg}}catch(e){}
  for(let i=0;i<20;i++) await new Promise(r=>requestAnimationFrame(r));
  note('pre-upload who='+(ui.msgWho&&ui.msgWho.n)+' msg='+String(ui.msg||'').slice(0,60)+' night='+(typeof nightNow==='function'?nightNow():'?'));
  try{
    const t=await upload(window.__SHOT+'.png');
    note('uploaded '+t); document.title='SHOT_OK';
  }catch(e){note('FAIL upload '+e); document.title='SHOT_FAIL_UP'}
}
addEventListener('load',()=>setTimeout(run,300));
</script>
