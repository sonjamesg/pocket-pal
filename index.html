<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5b4b8a">
<title>Pocket Pal</title><link rel="stylesheet" href="style.css"></head><body>
<div id="console">
 <div id="bezel"><div class="led" id="led"></div><canvas id="screen" width="160" height="144"></canvas><div id="brand">POCKET&nbsp;PAL</div></div>
 <div id="controls">
  <div id="dpad"><button data-k="up" class="d up">▲</button><button data-k="left" class="d left">◀</button><span class="d mid"></span><button data-k="right" class="d right">▶</button><button data-k="down" class="d down">▼</button></div>
  <div id="ab"><button data-k="b" class="btn b">B</button><button data-k="a" class="btn a">A</button></div>
 </div>
 <div id="ss"><button data-k="select" class="pill">SELECT</button><button data-k="start" class="pill">START</button></div>
</div>
<script src="game.js"></script></body></html>
