<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1d1830">
<title>Pocket Pal</title><link rel="stylesheet" href="style.css?v=4"></head><body data-layout="portrait">
<main id="app" class="layout-v3">
 <section id="screenwrap"><canvas id="screen" width="240" height="216"></canvas></section>
 <section id="deck">
  <div id="padL" class="zone"><div id="dpad">
   <button data-k="up" class="d up" aria-label="Up"><i></i></button><button data-k="left" class="d left" aria-label="Left"><i></i></button>
   <span class="d mid"></span><button data-k="right" class="d right" aria-label="Right"><i></i></button><button data-k="down" class="d down" aria-label="Down"><i></i></button></div></div>
  <div id="padM" class="zone"><button data-k="select" class="pill">SELECT</button><div class="logo">POCKET&nbsp;PAL</div><button data-k="start" class="pill">START</button></div>
  <div id="padR" class="zone"><div id="ab"><button data-k="b" class="btn b">B</button><button data-k="a" class="btn a">A</button></div></div>
 </section>
</main>
<script src="game.js?v=4"></script></body></html>
